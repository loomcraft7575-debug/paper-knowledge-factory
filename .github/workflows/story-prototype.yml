name: Render Paper Knowledge story prototype

on:
  workflow_dispatch:
  push:
    paths:
      - "story/trigger.txt"

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-v1-int8
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render story prototype
        env:
          KOKORO_CACHE: .cache/kokoro
        run: python src/story_prototype.py
      - name: Upload story prototype
        uses: actions/upload-artifact@v4
        with:
          name: paper-knowledge-story-prototype
          path: output/paper_knowledge_story_prototype.mp4
          retention-days: 2
